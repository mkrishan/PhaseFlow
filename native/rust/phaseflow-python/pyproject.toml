[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "phaseflow-native"
version = "0.1.0"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Manish Krishan Lal" }]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "_phaseflow_native"
bindings = "pyo3"
